services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loning_digital_dev
      POSTGRES_USER: loning
      POSTGRES_PASSWORD: loning_local_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - loning_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loning -d loning_digital"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  loning_postgres_data:
