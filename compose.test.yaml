services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DISPOSABLE_DB_NAME:-loning_phase0_test}
      POSTGRES_USER: loning_test
      POSTGRES_PASSWORD: loning_disposable_only
    ports:
      - "127.0.0.1:${DISPOSABLE_DB_PORT}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loning_test -d ${DISPOSABLE_DB_NAME:-loning_phase0_test}"]
      interval: 1s
      timeout: 3s
      retries: 60

  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:${DISPOSABLE_MINIO_PORT}:9000"
      - "127.0.0.1:${DISPOSABLE_MINIO_CONSOLE_PORT}:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 1s
      timeout: 3s
      retries: 60