services:
  - type: web
    name: loning-preview
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:backend
    startCommand: npm run db:migrate --workspace=backend && npm start --workspace=backend
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        renderKey: PORT
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_TTL_HOURS
        value: "168"
      - key: MEDIA_STORAGE_DRIVER
        value: s3
      - key: MEDIA_PUBLIC_BASE_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_DISPLAY_NAME
        value: Administrator
